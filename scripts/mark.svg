<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    RaumLogo mark - foreground layer of the macOS 26 Liquid Glass icon.
    Dark mini mark (#141418) on transparent: square + 3 rays, mirrored so
    the rays fan out from the top-left corner, tilted +10 deg, placed
    top-left with a 14% gap. The background layer supplies the light
    (#f5f5f5) fill; macOS handles squircle shape and glass material.
    Placement maps the 100-unit design box onto the full 1024 canvas.
  -->
  <g transform="translate(137.2 137.2) scale(3.277) rotate(10 50 50) translate(100 0) scale(-1 1)"
     stroke="#141418" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="96" height="96"/>
    <line x1="98" y1="2" x2="2" y2="50"/>
    <line x1="98" y1="2" x2="2" y2="98"/>
    <line x1="98" y1="2" x2="50" y2="98"/>
  </g>
</svg>
