<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Squircle background: 900x900 centered in 1024x1024 canvas, light fill.
    rx="201" ~ 22.37% of 900px (standard Apple squircle proportion).
    Mark: dark mini logo (square + 3 rays), mirrored so rays fan from the
    top-left corner, tilted +10 deg, 14% gap to top/left tile edges.
    The 100-unit design box maps onto the 900px squircle (factor 9).
  -->
  <rect x="62" y="62" width="900" height="900" rx="201" ry="201" fill="#f5f5f5"/>
  <g transform="translate(62 62) scale(9) translate(13.4 13.4) scale(0.32) rotate(10 50 50) translate(100 0) scale(-1 1)"
     stroke="#141418" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="96" height="96"/>
    <line x1="98" y1="2" x2="2" y2="50"/>
    <line x1="98" y1="2" x2="2" y2="98"/>
    <line x1="98" y1="2" x2="50" y2="98"/>
  </g>
</svg>
